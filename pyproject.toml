[project]
name = "xuna-backend"
version = "0.1.0"
description = "XUNA optional Cloud Brain: modular monolith (FastAPI + PostgreSQL)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg[binary]==3.2.3",
    "pydantic==2.10.4",
    "pyjwt==2.10.1",
    "cryptography==44.0.0",
    "httpx==0.28.1",
    # Phone voice V1 TTS (owner D16, 2026-10-22). LGPL-3.0, unofficial free service.
    # 7.3.1 because Microsoft's handshake change broke 7.2.x (403) in October 2026.
    "edge-tts==7.3.1",
    # WebSocket server for uvicorn: device-direct /v1/devices/connect and voice (owner 2026-10-27). BSD-3.
    "websockets==13.1",
]

[project.optional-dependencies]
# Local TTS fallback. GPL-3.0: kept out of the default install on purpose.
piper = [
    "piper-tts==1.8.0",
]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
    "mypy==1.14.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PTH", "T20"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["xuna_backend"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["postgres: needs XUNA_TEST_DATABASE_URL (PostgreSQL)"]
